        description: Search on the entire content of the resource
        style: simple
      - name: status
        in: query
        description: current | retired | entered-in-error
        style: simple
      responses:
        '200':
          description: Success
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FHIR-JSON-RESOURCE'
              example: null
            application/fhir+xml:
              schema:
