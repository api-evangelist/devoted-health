aid: devoted-health
name: Devoted Health
description: 'Devoted Health is a Medicare Advantage health insurance company that operates its own health
  plans, clinical care, and pharmacy for older Americans. For developers, Devoted publishes CMS Interoperability
  (21st Century Cures Act) FHIR R4 (4.0.1) APIs: a member-authorized Patient Access API exposing claims,
  clinical, and coverage data (Patient, Condition, Encounter, Medication, ExplanationOfBenefit), and public
  Provider Directory, Pharmacy Directory, and Drug Formulary APIs (Practitioner, Organization, Location,
  HealthcareService, InsurancePlan, MedicationKnowledge, List). Access uses OAuth 2.0 / OpenID Connect
  with SMART-on-FHIR authorization; third-party member-facing apps register for a Client ID and Secret
  through Devoted''s interoperability team.'
